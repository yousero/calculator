<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f0f2f5; /* Мягкий фон страницы */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Корпус калькулятора */
  .calc {
    width: 320px;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
  }

  /* Ограниченное поле вывода (Дисплей) */
  .display {
    height: 90px;
    background-color: #f8f9fa;
    border: 1px solid #e9ecef;
    border-radius: 10px;
    margin-bottom: 20px;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    padding: 15px;
    font-size: 36px;
    font-weight: 500;
    color: #212529;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    
    /* ОГРАНИЧЕНИЕ: текст не вылезет за рамки */
    overflow: hidden;
    white-space: nowrap; 
    text-overflow: ellipsis;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.03);
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  /* Базовый стиль кнопок */
  button {
    border: 1px solid #dee2e6;
    background-color: #ffffff;
    color: #212529;
    padding: 18px 0;
    font-size: 20px;
    font-weight: 500;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }

  button:hover {
    background-color: #f8f9fa;
    border-color: #ced4da;
  }

  button:active {
    transform: scale(0.95);
    background-color: #e9ecef;
  }

  /* Операторы (÷, ×, −, +) */
  .op {
    color: #0d6efd;
    background-color: #f0f6ff;
    border-color: #d0e2ff;
  }

  .op:hover {
    background-color: #e0edff;
    border-color: #a3c9ff;
  }

  /* Кнопки очистки (AC, ⌫) */
  .fn {
    color: #dc3545;
    background-color: #fff5f5;
    border-color: #ffd8d8;
  }

  .fn:hover {
    background-color: #ffe5e5;
    border-color: #ffb3b3;
  }

  /* Кнопка Равно (=) */
  .eq {
    background-color: #0d6efd;
    color: #ffffff;
    border-color: #0d6efd;
  }

  .eq:hover {
    background-color: #0b5ed7;
    border-color: #0a58ca;
  }

  /* Кнопка 0 занимает 2 колонки */
  .zero {
    grid-column: span 2;
  }
</style>
</head>
<body>

<div class="calc">
  <!-- Ограниченное поле -->
  <div class="display" id="result">0</div>

  <div class="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="del">⌫</button>
    <button data-act="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="eq" data-act="equals">=</button>
  </div>
</div>

<script>
  const resultEl = document.getElementById('result');
  
  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;
  
  // Максимальная длина вводимого числа
  const MAX_LENGTH = 12; 

  const render = () => {
    resultEl.textContent = current;
  };

  const inputNumber = (digit) => {
    if (justEvaluated) {
      current = '0';
      justEvaluated = false;
    }

    if (digit === '.') {
      if (!current.includes('.')) current += '.';
    } else if (current === '0') {
      current = digit;
    } else {
      // ОГРАНИЧЕНИЕ ВВОДА
      if (current.replace('-', '').replace('.', '').length >= MAX_LENGTH) return;
      current += digit;
    }
    render();
  };

  const chooseOperator = (op) => {
    if (operator && previous !== null && !justEvaluated) {
      calculate();
    }
    previous = current;
    operator = op;
    current = '0';
    justEvaluated = false;
    render();
  };

  const calculate = () => {
    if (previous === null || operator === null) return;
    
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let res;

    switch (operator) {
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/': res = b === 0 ? 'Ошибка' : a / b; break;
    }

    if (typeof res === 'number') {
      res = Math.round(res * 1e10) / 1e10;
      current = String(res);
      
      if (current.length > MAX_LENGTH + 2) {
         current = res.toExponential(5); 
      }
    } else {
      current = String(res);
    }

    previous = null;
    operator = null;
    justEvaluated = true;
    render();
  };

  const clearAll = () => {
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
    render();
  };

  const del = () => {
    if (justEvaluated) return clearAll();
    current = current.length > 1 ? current.slice(0, -1) : '0';
    if (current === '-') current = '0';
    render();
  };

  const percent = () => {
    current = String(parseFloat(current) / 100);
    render();
  };

  // Обработка кликов
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.num) inputNumber(btn.dataset.num);
      else if (btn.dataset.op) chooseOperator(btn.dataset.op);
      else if (btn.dataset.act === 'equals') calculate();
      else if (btn.dataset.act === 'clear') clearAll();
      else if (btn.dataset.act === 'del') del();
      else if (btn.dataset.act === 'percent') percent();
    });
  });

  // Поддержка клавиатуры
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) inputNumber(k);
    else if (k === '.' || k === ',') inputNumber('.');
    else if (['+', '-', '*', '/'].includes(k)) chooseOperator(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); calculate(); }
    else if (k === 'Backspace') del();
    else if (k === 'Escape') clearAll();
    else if (k === '%') percent();
  });

  render();
</script>

</body>
</html>
