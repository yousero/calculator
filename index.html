<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e2e;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .calc {
    width: 100%;
    max-width: 340px;
    background: #2a2a3c;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .display {
    background: #17171f;
    border-radius: 14px;
    padding: 20px 16px;
    text-align: right;
    margin-bottom: 16px;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .history {
    color: #6b6b85;
    font-size: 14px;
    height: 18px;
    overflow: hidden;
    white-space: nowrap;
  }
  .result {
    color: #fff;
    font-size: 38px;
    font-weight: 600;
    word-wrap: break-word;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 12px;
    padding: 18px 0;
    font-size: 20px;
    font-weight: 500;
    background: #3a3a52;
    color: #eee;
    cursor: pointer;
    transition: background .12s, transform .06s;
    user-select: none;
  }
  button:hover { background: #4a4a68; }
  button:active { transform: scale(.96); }
  .op { background: #4a4a68; color: #7dc4ff; }
  .fn { background: #33334a; color: #ff9f6b; }
  .eq { background: #ff7b39; color: #fff; grid-column: span 1; }
  .eq:hover { background: #ff8f55; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="history" id="history"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-act="clear">AC</button>
    <button class="fn" data-act="del">⌫</button>
    <button class="fn" data-act="percent">%</button>
    <button class="op" data-op="/">÷</button>

    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>

    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>

    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>

    <button class="zero" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="eq" data-act="equals">=</button>
  </div>
</div>

<script>
  const resultEl = document.getElementById('result');
  const historyEl = document.getElementById('history');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;

  const render = () => {
    resultEl.textContent = current;
    historyEl.textContent = previous !== null
      ? `${previous} ${opSymbol(operator)}`
      : '';
  };

  const opSymbol = (op) =>
    ({ '+': '+', '-': '−', '*': '×', '/': '÷' }[op] || '');

  const inputNumber = (digit) => {
    if (justEvaluated) {
      current = '0';
      justEvaluated = false;
    }
    if (digit === '.') {
      if (!current.includes('.')) current += '.';
    } else if (current === '0') {
      current = digit;
    } else {
      current += digit;
    }
    render();
  };

  const chooseOperator = (op) => {
    if (operator && previous !== null && !justEvaluated) {
      // досчитать промежуточный результат
      calculate();
    }
    previous = current;
    operator = op;
    current = '0';
    justEvaluated = false;
    render();
    // показываем оператор в истории, но result = 0
    historyEl.textContent = `${previous} ${opSymbol(operator)}`;
  };

  const calculate = () => {
    if (previous === null || operator === null) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let res;
    switch (operator) {
      case '+': res = a + b; break;
      case '-': res = a - b; break;
      case '*': res = a * b; break;
      case '/': res = b === 0 ? 'Ошибка' : a / b; break;
    }
    if (typeof res === 'number') {
      res = Math.round(res * 1e10) / 1e10;
    }
    current = String(res);
    historyEl.textContent = `${previous} ${opSymbol(operator)} ${b} =`;
    previous = null;
    operator = null;
    justEvaluated = true;
    resultEl.textContent = current;
  };

  const clearAll = () => {
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
    render();
  };

  const del = () => {
    if (justEvaluated) return clearAll();
    current = current.length > 1 ? current.slice(0, -1) : '0';
    render();
  };

  const percent = () => {
    current = String(parseFloat(current) / 100);
    render();
  };

  // клики
  document.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.num) inputNumber(btn.dataset.num);
      else if (btn.dataset.op) chooseOperator(btn.dataset.op);
      else if (btn.dataset.act === 'equals') calculate();
      else if (btn.dataset.act === 'clear') clearAll();
      else if (btn.dataset.act === 'del') del();
      else if (btn.dataset.act === 'percent') percent();
    });
  });

  // клавиатура
  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) inputNumber(k);
    else if (k === '.' || k === ',') inputNumber('.');
    else if (['+', '-', '*', '/'].includes(k)) chooseOperator(k);
    else if (k === 'Enter' || k === '=') { e.preventDefault(); calculate(); }
    else if (k === 'Backspace') del();
    else if (k === 'Escape') clearAll();
    else if (k === '%') percent();
  });

  render();
</script>
</body>
</html>
